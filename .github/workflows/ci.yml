# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Installs the pnpm version written in "packageManager" (package.json)
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: backend/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: |
            backend/pnpm-lock.yaml
            frontend/pnpm-lock.yaml

      # --frozen-lockfile: fails if pnpm-lock.yaml does not match package.json
      - name: Install backend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: backend

      - name: Run backend tests
        run: pnpm test
        working-directory: backend

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Build frontend
        run: pnpm build
        working-directory: frontend