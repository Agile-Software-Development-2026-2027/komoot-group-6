# CI: runs on every pull request and on every push to main.
# The job "test" is a required check on main: a pull request cannot be merged until it is green.
# Do not rename the job.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # lets you run CI by hand from the Actions tab

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Add here the steps that build and test your project.
      # Until then this job does nothing and always passes.
      - name: Configura Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Installa dipendenze frontend
        run: npm ci
        working-directory: frontend

      - name: Esegui test frontend
        run: npx vitest run
        working-directory: frontend